<!doctype html>
<html lang="{{lang}}"{{preview_attr}}>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}{{canonical_link}}
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8FBF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08120D" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="McRoberts PAC">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:alt" content="McRoberts PAC, the Parent Advisory Council of Hugh McRoberts Secondary">
<meta property="og:locale" content="en_CA">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}assets/img/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/img/touch-icon.png">
<link rel="preload" href="{{root}}assets/fonts/big-shoulders.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem('pac-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{root}}assets/css/site.css">
{{page_css}}{{jsonld}}
</head>
<body class="{{body_class}}">
<a class="skip" href="#main" lang="en">Skip to main content</a>
<!--BANNER-->
<!--HEADER-->
<main id="main" tabindex="-1">
<!--MAIN-->
</main>
<!--FOOTER-->
<p class="copy-status" role="status" aria-live="polite"></p>
<script src="{{root}}assets/js/site.js" defer></script>
</body>
</html>
